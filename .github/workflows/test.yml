name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run benchmark

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the bundled example through the composite action
        uses: ./
        with:
          candidate: examples/candidate.json
          evidence: examples/evidence.json
          now: "1800000000000"
          format: sarif
          output: action-smoke.sarif
      - name: Validate the SARIF report
        run: node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('action-smoke.sarif','utf8')); if(report.version !== '2.1.0' || report.runs[0].results.length !== 0) process.exit(1)"
